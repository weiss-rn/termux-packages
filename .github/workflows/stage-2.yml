name: Stage 2 - Package FFmpeg for Android

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of Stage 1 (leave blank to use latest successful run)'
        required: false
        default: ''

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, arm, i686, x86_64]

    steps:
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y binutils zip

      # Grabs the artifact from Stage 1 automatically
      - name: Download Stage 1 deb artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: stage-1.yml
          workflow_conclusion: success
          run_id: ${{ inputs.run_id }}       # Uses input if specified, otherwise latest success
          name: ffmpeg-${{ matrix.arch }}
          path: debs/

      - name: Extract debs and prepare Android .so files
        shell: bash
        run: |
          mkdir -p extracted staging staging_zip/usr/lib final_output

          echo "Deb packages found:"
          ls -la debs/

          # 1. Extract all .deb files from Stage 1
          find debs/ -type f -name "*.deb" -exec dpkg-deb -x {} extracted/ \;

          # 2. Locate the Termux usr folder
          USR_DIR="extracted/data/data/com.termux/files/usr"
          if [ ! -d "$USR_DIR" ]; then
            echo "Fallback: finding usr folder dynamically..."
            USR_DIR=$(find extracted -type d -name "usr" | head -n 1)
          fi
          echo "Using USR_DIR: $USR_DIR"

          # 3. Create libffmpeg.so and libffprobe.so
          if [ ! -f "$USR_DIR/bin/ffmpeg" ]; then
            echo "::error::ffmpeg binary not found in $USR_DIR/bin/"
            exit 1
          fi

          cp "$USR_DIR/bin/ffmpeg" staging/libffmpeg.so
          cp "$USR_DIR/bin/ffprobe" staging/libffprobe.so

          # Strip debug symbols to reduce APK size significantly
          strip --strip-unneeded staging/libffmpeg.so staging/libffprobe.so || true

          # 4. Create libffmpeg.zip.so containing runtime shared libraries
          #
          # The payload has to be the whole $TERMUX_PREFIX/lib directory, not just the libraries
          # that ship inside ffmpeg's own .deb. ffmpeg links against 60+ libraries (x264, x265,
          # vpx, dav1d, aom, ass, freetype, openssl, ocl-icd, ...), but Termux installs those
          # dependency packages as prebuilt debs inside the build container and never writes
          # them to output/, so they reach us only through the prefix archive Stage 1 captured.
          #
          # The working 7.1.1 payload is proof of the required shape: its 184 entries include
          # libgme.so, libglib-2.0.so, libnettle.so.8.11, libv4l1.so and libxvidcore.so, none of
          # which any ffmpeg .deb contains. A closure of just libav* is what produced an archive
          # that installed cleanly and then failed to load libavcodec.so on the device.
          LIB_ARCHIVE=$(find debs/ -name 'termux-libs-*.tar' | head -n 1)
          if [ -z "$LIB_ARCHIVE" ]; then
            echo "::error::no termux-libs-*.tar in debs/ - Stage 1 did not capture the library closure"
            exit 1
          fi
          echo "Library archive: $LIB_ARCHIVE"

          rm -rf prefix_lib
          mkdir -p prefix_lib
          tar -xf "$LIB_ARCHIVE" -C prefix_lib

          # Flat shared objects only: the loader resolves DT_NEEDED entries against this one
          # directory, and the archive also holds headers, pkgconfig and cmake files that are
          # dead weight in an APK.
          #
          # -P preserves symlinks. libavcodec.so points at libavcodec.so.62 and the loader
          # looks up the versioned SONAME, so both the link name and its target must ship;
          # zip -y below stores them as links, which FFmpeg.kt recreates via Os.symlink.
          find prefix_lib -maxdepth 1 \
            \( -name '*.so' -o -name '*.so.*' \) \
            -exec cp -P {} staging_zip/usr/lib/ \;

          # The closure check starts from the two binaries, so they have to sit beside the libs
          # for the duration of it. They are removed again before zipping: FFmpeg.kt reads them
          # from nativeLibraryDir, and shipping a second copy inside the archive would only add
          # ~550 KB and deviate from the 7.1.1 payload layout.
          cp -P staging/libffmpeg.so staging/libffprobe.so staging_zip/usr/lib/

          echo "Libraries packaged: $(find staging_zip/usr/lib \( -type f -o -type l \) | wc -l)"
          echo ".deb packages consumed: $(find debs/ -type f -name '*.deb' | wc -l)"
          # Surfacing this makes an incomplete Stage 1 obvious: if only the ffmpeg package was
          # downloaded, every dependency below will be reported missing.
          find debs/ -type f -name '*.deb' -printf '  %f\n' | sort | head -n 60

          # 5. Fail loudly if the libraries ffmpeg actually loads cannot be resolved.
          #
          # Scope matters here, and getting it wrong is as bad as missing the bug entirely.
          # Three scopes were measured against both real payloads:
          #
          #   flat scan of every lib in the payload -> 7.1.1 reports 19 unresolved and FAILS.
          #     Wrong. Those live in libraries ffmpeg only ever dlopen()s opportunistically
          #     (glib, girepository, v4l, gnutls-dane); the archive works on a real device.
          #   full transitive closure                   -> 7.1.1 reports 4 unresolved and FAILS.
          #     Also wrong. libandroid-support, libandroid-posix-semaphore, libexpat.so.1 and
          #     libcrypto.so.3 are picked up from the device at runtime through ffmpeg's
          #     RUNPATH, which points at the Termux prefix rather than the app's own dir.
          #   depth 2 from the two entry binaries       -> 7.1.1 reports 0, 8.1.3 reports 60.
          #     Correct, and it is what ships.
          #
          # Depth 2 is "libffmpeg/libffprobe and everything they link against, plus what that
          # links against" - precisely the libav core and its third-party codecs. Anything
          # unresolved past that is reported but not fatal, since the working 7.1.1 build
          # already depends on the device supplying them.
          echo "Checking DT_NEEDED closure from libffmpeg.so / libffprobe.so..."
          : > missing.txt
          : > runtime.txt
          : > platform.txt
          declare -A VISITED=()
          QUEUE=("libffmpeg.so:0" "libffprobe.so:0")
          while [ "${#QUEUE[@]}" -gt 0 ]; do
            ITEM="${QUEUE[0]}"
            QUEUE=("${QUEUE[@]:1}")
            CUR="${ITEM%:*}"
            DEPTH="${ITEM##*:}"
            if [ -n "${VISITED[$CUR]:-}" ]; then continue; fi
            VISITED[$CUR]=1

            SO="staging_zip/usr/lib/$CUR"
            if [ ! -e "$SO" ]; then
              echo "$CUR (reached from libffmpeg/libffprobe)" >> missing.txt
              continue
            fi

            # Follow symlinks before reading: libavcodec.so -> libavcodec.so.62, and the loader
            # reads DT_NEEDED off the real file, not the link.
            REAL="$(readlink -f "$SO")"
            head -c 4 "$REAL" 2>/dev/null | grep -q 'ELF' || continue

            while read -r DEP; do
              [ -n "$DEP" ] || continue
              if [ -n "${VISITED[$DEP]:-}" ]; then continue; fi
              if [ -e "staging_zip/usr/lib/$DEP" ]; then
                QUEUE+=("$DEP:$((DEPTH + 1))")
                continue
              fi
              # Bionic and the public Android NDK ship these themselves. Skipping them is the
              # only reason a missing entry is not fatal, so they are logged rather than
              # dropped, to keep that assumption visible in the run.
              case "$DEP" in
                libc.so|libm.so|libdl.so|liblog.so|libz.so.1|libandroid.so|libEGL.so|\
                libGLESv2.so|libGLESv1_CM.so|libvulkan.so|libOpenSLES.so|libaaudio.so|\
                libcamera2ndk.so|libmediandk.so|libneuralnetworks.so|libnativewindow.so|\
                libbinder_ndk.so|libstdc++.so|libc++_shared.so|libtinyexceptions.so|\
                libjnigraphics.so|libvdex.so)
                  # Recorded by name only. Attributing a requirer here produces hundreds of
                  # lines - libc.so alone is needed by 75 of them - and drowns the signal.
                  echo "$DEP" >> platform.txt
                  ;;
                *)
                  # Breadth-first, so the shallowest requirer is seen first and the worst
                  # classification wins.
                  if [ "$DEPTH" -le 1 ]; then
                    echo "MISSING: $DEP (needed by $(basename "$REAL"))" >> missing.txt
                  else
                    echo "DEFERRED: $DEP (needed by $(basename "$REAL"))" >> runtime.txt
                  fi
                  ;;
              esac
            done < <(readelf -d "$REAL" 2>/dev/null | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p')
          done

          echo "Load set reached: ${#VISITED[@]} libraries"

          if [ -s missing.txt ]; then
            # Dedupe: one absent library can be needed by several binaries, and the raw count
            # overstates how many packages are actually missing.
            sort -u missing.txt -o missing.txt
            echo "::error::$(wc -l < missing.txt) libraries in the ffmpeg load set are unresolved"
            cat missing.txt
            exit 1
          fi
          echo "Dependency closure satisfied at depth 2."

          if [ -s runtime.txt ]; then
            sort -u runtime.txt -o runtime.txt
            echo "::warning::beyond depth 2 - expect these from the device's Termux prefix via RUNPATH"
            cat runtime.txt
          fi

          if [ -s platform.txt ]; then
            sort -u platform.txt -o platform.txt
            echo "Resolved from the Android platform, not bundled ($(wc -l < platform.txt)): $(tr '\n' ' ' < platform.txt)"
          fi

          rm -f staging_zip/usr/lib/libffmpeg.so staging_zip/usr/lib/libffprobe.so

          cd staging_zip
          zip -y -r ../staging/libffmpeg.zip.so usr/
          cd ..

          # 6. Move final artifacts to destination
          cp staging/libffmpeg.so final_output/
          cp staging/libffprobe.so final_output/
          cp staging/libffmpeg.zip.so final_output/

          echo "Final packaged files:"
          ls -lh final_output/

      - name: Upload Native Android Binaries (.so)
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android-${{ matrix.arch }}
          path: final_output/*
          if-no-files-found: error
