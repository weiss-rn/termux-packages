name: Build FFmpeg for Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, arm, i686, x86_64]

    steps:
      - name: Free Disk Space (Prevent Out-Of-Disk Crashes)
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Checkout Termux build system
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          # Pin to a known stable commit or tag instead of unstable master
          # Replace with a specific commit hash if master breaks often
          ref: master
          fetch-depth: 1

      - name: Build FFmpeg
        shell: bash
        run: |
          # 1. Create a bulletproof build runner script
          cat > build-ffmpeg.sh <<'SCRIPT'
          #!/bin/bash
          set -e
          export TERMUX_ARCH="${{ matrix.arch }}"
          export TERMUX_PREFIX=/data/youtubedl-android/usr
          export TERMUX_ANDROID_HOME=/data/youtubedl-android/home

          # -s: Skip checksum verification (fixes rotating/dirty mirror hashes)
          # -I: Install dependencies via binary packages if possible (speeds up build)
          ./build-package.sh -s ffmpeg
          SCRIPT

          chmod +x build-ffmpeg.sh

          # 2. Clean environment
          ./scripts/run-docker.sh ./clean.sh

          # 3. Run build with log redirection to prevent browser-crashing logs
          echo "::group::Building FFmpeg for ${{ matrix.arch }} (Hiding compiler spam)..."
          
          set +e
          ./scripts/run-docker.sh ./build-ffmpeg.sh > build.log 2>&1
          BUILD_EXIT_CODE=$?
          echo "::endgroup::"

          # 4. Handle failure intelligently
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "BUILD FAILED for ${{ matrix.arch }} with exit code $BUILD_EXIT_CODE!"
            echo "====================== RECENT ERROR LOGS ======================"
            # Print the last 150 lines to find the immediate problem
            tail -n 150 build.log
            echo "==============================================================="
            echo "::error::Build failed! Full logs saved as artifact."
            exit $BUILD_EXIT_CODE
          else
            echo "Build completed successfully for ${{ matrix.arch }}!"
          fi

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.arch }}
          path: build.log
          retention-days: 3

      - name: Extract FFmpeg packages
        shell: bash
        run: |
          mkdir -p extracted
          
          # Find all deb packages built
          find debs -type f -name '*.deb' \
            ! -name '*-dev_*.deb' \
            ! -name '*-static_*.deb' \
            -exec dpkg-deb -x '{}' extracted/ \;

          mkdir -p output
          
          TARGET_DIR="extracted/data/youtubedl-android"
          if [ ! -d "$TARGET_DIR" ]; then
            echo "::error::Target output directory $TARGET_DIR does not exist. Check deb outputs."
            ls -la debs/
            exit 1
          fi

          cd "$TARGET_DIR"
          rm -rf usr/share/man
          zip -y -r "$GITHUB_WORKSPACE/output/ffmpeg-${{ matrix.arch }}.zip" usr/

      - name: Upload FFmpeg archive
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.arch }}
          path: output/*.zip
          if-no-files-found: error
