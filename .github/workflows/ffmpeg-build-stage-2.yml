name: Stage 2 - Package FFmpeg for Android

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of Stage 1 (leave blank to use latest successful run)'
        required: false
        default: ''

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, arm, i686, x86_64]

    steps:
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y binutils zip

      # Grabs the artifact from Stage 1 automatically
      - name: Download Stage 1 deb artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: stage-1-ffmpeg-.yml  # <-- Set this to your Stage 1 file name (e.g. stage1.yml)
          workflow_conclusion: success
          run_id: ${{ inputs.run_id }}       # Uses input if specified, otherwise latest success
          name: ffmpeg-${{ matrix.arch }}
          path: debs/

      - name: Extract debs and prepare Android .so files
        shell: bash
        run: |
          mkdir -p extracted staging staging_zip/usr/lib final_output

          echo "Deb packages found:"
          ls -la debs/

          # 1. Extract all .deb files from Stage 1
          find debs/ -type f -name "*.deb" -exec dpkg-deb -x {} extracted/ \;

          # 2. Locate the Termux usr folder
          USR_DIR="extracted/data/data/com.termux/files/usr"
          if [ ! -d "$USR_DIR" ]; then
            echo "Fallback: finding usr folder dynamically..."
            USR_DIR=$(find extracted -type d -name "usr" | head -n 1)
          fi
          echo "Using USR_DIR: $USR_DIR"

          # 3. Create libffmpeg.so and libffprobe.so
          if [ ! -f "$USR_DIR/bin/ffmpeg" ]; then
            echo "::error::ffmpeg binary not found in $USR_DIR/bin/"
            exit 1
          fi

          cp "$USR_DIR/bin/ffmpeg" staging/libffmpeg.so
          cp "$USR_DIR/bin/ffprobe" staging/libffprobe.so

          # Strip debug symbols to reduce APK size significantly
          strip --strip-unneeded staging/libffmpeg.so staging/libffprobe.so || true

          # 4. Create libffmpeg.zip.so containing runtime shared libraries
          if [ -d "$USR_DIR/lib" ]; then
            cp -P "$USR_DIR"/lib/*.so* staging_zip/usr/lib/ 2>/dev/null || true
          fi

          cd staging_zip
          zip -y -r ../staging/libffmpeg.zip.so usr/
          cd ..

          # 5. Move final artifacts to destination
          cp staging/libffmpeg.so final_output/
          cp staging/libffprobe.so final_output/
          cp staging/libffmpeg.zip.so final_output/

          echo "Final packaged files:"
          ls -lh final_output/

      - name: Upload Native Android Binaries (.so)
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android-${{ matrix.arch }}
          path: final_output/*
          if-no-files-found: error
